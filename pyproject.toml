[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-canary-memory-sentinel"
version = "0.1.0"
description = "Injects and monitors dynamic cryptographic canaries in agent memory to detect context poisoning and unauthorized memory tampering"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
agent-canary-memory-sentinel = "agent_canary_memory_sentinel.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_canary_memory_sentinel*"]
